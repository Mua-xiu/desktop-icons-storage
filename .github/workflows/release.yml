name: Build release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，例如 0.4.0"
        required: true
        default: "0.4.0"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}" -replace '^v', ''
          } else {
            $version = "${{ inputs.version }}"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build portable app and installer
        shell: pwsh
        run: .\scripts\build-release.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: DesktopIconsStorage-${{ steps.version.outputs.version }}-win-x64
          path: |
            artifacts/installer/*.exe
            artifacts/release/*.exe
            artifacts/release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = "${{ steps.version.outputs.version }}"
          $files = @(
            "artifacts/installer/DesktopIconsStorage-Setup-$version-win-x64.exe",
            "artifacts/release/DesktopIconsStorage-$version-win-x64.exe",
            "artifacts/release/SHA256SUMS.txt"
          )
          gh release create $tag @files --verify-tag --generate-notes --title "DesktopIconsStorage $tag"
